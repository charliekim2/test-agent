name: po-invoice-interview

# Pick your language with a profile:
#   docker compose --profile python up   (postgres + erp + python app)
#   docker compose --profile node   up   (postgres + erp + node app)
# postgres and erp carry no profile, so they start under either invocation.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 2s
      timeout: 3s
      retries: 15

  erp:
    build: ./erp
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  app-python:
    profiles: ["python"]
    build: ./app/python
    depends_on:
      postgres:
        condition: service_healthy
      erp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://interview:interview@postgres:5432/interview
      ERP_BASE_URL: http://erp:9000
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro       # seed JSON, read-only
      - ./app/python:/app     # live code editing (no rebuild to re-run)
    working_dir: /app
    command: python main.py

  app-node:
    profiles: ["node"]
    build: ./app/node
    depends_on:
      postgres:
        condition: service_healthy
      erp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://interview:interview@postgres:5432/interview
      ERP_BASE_URL: http://erp:9000
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
      - ./app/node:/app
      - /app/node_modules     # keep image-installed deps (pg) from being hidden by the bind mount above
    working_dir: /app
    command: node index.js
